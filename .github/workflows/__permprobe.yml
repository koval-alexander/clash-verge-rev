name: __permprobe

on:
  workflow_dispatch:

permissions: write-all

env:
  TAG_NAME: autobuild

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make dummy files
        run: |
          echo "softprops-probe" > dummy_sp.txt
          echo "gh-probe" > dummy_gh.txt

      - name: A) softprops with files (exactly like the failing job)
        id: softprops
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 'Clash Verge Rev AutoBuild'
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dummy_sp.txt

      - name: Report A
        run: echo "softprops outcome = ${{ steps.softprops.outcome }}"

      - name: B) gh release upload (proposed fix)
        id: gh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload autobuild dummy_gh.txt --clobber && echo "GH_UPLOAD_OK" || echo "GH_UPLOAD_FAILED"

      - name: Report B
        run: echo "gh outcome = ${{ steps.gh.outcome }}"

      - name: C) cleanup probe assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset autobuild dummy_sp.txt -y 2>/dev/null || true
          gh release delete-asset autobuild dummy_gh.txt -y 2>/dev/null || true
          echo "cleanup done"
